name: Fix Moodle Hydrosphere Question Bank
on:
  push:
    paths: ['.github/workflows/fix-moodle-bank.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fix_moodle_gidrosfera_bank.py
      - name: Commit corrected Moodle XML and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moodle_Gidrosfera_ISPRAVLENO_21_vopros.xml Moodle_Gidrosfera_dopolnitelnye_6_voprosov.xml Moodle_Gidrosfera_ISPRAVLENO.zip
          git diff --cached --quiet || (git commit -m "Correct Moodle XML question bank" && git push)
