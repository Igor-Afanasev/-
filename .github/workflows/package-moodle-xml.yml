name: Package Moodle XML download
on:
  push:
    paths:
      - '.github/workflows/package-moodle-xml.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack question bank into zip
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          import xml.etree.ElementTree as ET
          source='Moodle_Gidrosfera_bank_27_questions.xml'
          ET.parse(source)
          with ZipFile('Moodle_Gidrosfera_bank_27_questions.zip','w',ZIP_DEFLATED) as z:
              z.write(source)
          PY
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moodle_Gidrosfera_bank_27_questions.zip
          git diff --cached --quiet || (git commit -m "Package Moodle XML as ZIP for easy download" && git push)
