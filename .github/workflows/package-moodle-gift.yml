name: Package GIFT for Download
on:
  push:
    paths:
      - '.github/workflows/package-moodle-gift.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create downloadable archive
        run: |
          python - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          f=Path('Moodle_Gidrosfera_GIFT_voprosy.txt')
          assert f.exists() and f.stat().st_size>1000
          with ZipFile('Moodle_Gidrosfera_GIFT_SKACHAT.zip','w',ZIP_DEFLATED) as z:
              z.write(f,arcname=f.name)
          with ZipFile('Moodle_Gidrosfera_GIFT_SKACHAT.zip') as z:
              assert z.read(f.name)==f.read_bytes()
          print('ZIP verified')
          PY
      - name: Commit zip file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moodle_Gidrosfera_GIFT_SKACHAT.zip
          git diff --cached --quiet || (git commit -m "Add downloadable GIFT ZIP archive" && git push)
