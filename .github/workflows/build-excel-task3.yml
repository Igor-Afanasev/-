name: Build Excel histogram assignment 3
on:
  push:
    paths:
      - '.github/workflows/build-excel-task3.yml'
      - 'create_task3_histogram.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install xlsxwriter
      - run: python create_task3_histogram.py
      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zadanie_3_variant_14_gistogramma_s_nakopleniem.xlsx
          git diff --cached --quiet || (git commit -m "Add Excel histogram assignment 3" && git push)
