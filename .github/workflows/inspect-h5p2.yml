name: Inspect working H5P sample
on:
  push:
    paths: ['.github/workflows/inspect-h5p2.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python inspect_h5p_template2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h5p_sample_structure.json
          git diff --cached --quiet || (git commit -m "Save H5P template structure" && git push)
