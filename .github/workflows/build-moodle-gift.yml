name: Build Moodle GIFT Question Bank
on:
  push:
    paths:
      - '.github/workflows/build-moodle-gift.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python convert_gidrosfera_to_gift.py
      - name: Commit GIFT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moodle_Gidrosfera_GIFT_voprosy.txt
          git diff --cached --quiet || (git commit -m "Add Moodle GIFT hydrosphere bank" && git push)
