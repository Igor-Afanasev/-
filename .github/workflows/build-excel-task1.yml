name: Build Excel polar diagrams
on:
  push:
    paths:
      - '.github/workflows/build-excel-task1.yml'
      - 'create_task1_charts.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - run: python create_task1_charts.py
      - name: Commit generated Excel workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zadanie_1_varianty_1_i_14_grafiki.xlsx
          git diff --cached --quiet || (git commit -m "Add Excel polar diagrams for variants 1 and 14" && git push)
