name: Build H5P Hydrosphere Presentation
on:
  push:
    paths: ['.github/workflows/build-h5p-hydrosphere.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python build_gidrosfera_h5p.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gidrosfera_interaktivnaya_prezentaciya_10_voprosov.h5p
          git diff --cached --quiet || (git commit -m "Add hydrosphere H5P presentation with 10 questions" && git push)
