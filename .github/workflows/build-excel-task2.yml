name: Build Excel surface diagram
on:
  push:
    paths:
      - '.github/workflows/build-excel-task2.yml'
      - 'create_task2_surface.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl
      - run: python create_task2_surface.py
      - name: Commit generated Excel workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zadanie_2_varianty_1_i_16_poverhnost.xlsx
          git diff --cached --quiet || (git commit -m "Add Excel 3D surface diagram for variants 1 and 16" && git push)
